<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,serif;background:#f0ede8;min-height:100vh;}
.hdr{background:#1a3a4a;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.hl{display:flex;align-items:center;gap:12px;}
.hlogo{width:46px;height:46px;object-fit:contain;border-radius:6px;background:white;padding:2px;}
.hdr h1{font-size:16px;font-weight:bold;}
.hdr p{font-size:11px;opacity:0.7;margin-top:2px;}
.nav button{padding:8px 13px;border:none;border-radius:6px;cursor:pointer;font-family:Georgia,serif;font-size:13px;margin-left:6px;}
.on{background:white!important;color:#1a3a4a!important;font-weight:bold;}
.off{background:rgba(255,255,255,0.18)!important;color:white!important;}
.wrap{max-width:760px;margin:0 auto;padding:24px 14px;}
.card{background:white;border-radius:12px;padding:24px;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
.card h2{color:#1a3a4a;font-size:19px;margin-bottom:20px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.span2{grid-column:1/-1;}
label{display:block;font-size:11px;color:#666;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
input,select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:6px;font-family:Georgia,serif;font-size:15px;background:#fafaf8;}
input:focus,select:focus{border-color:#1a3a4a;outline:none;}
.numbox{margin-top:16px;padding:14px 16px;background:#e8f4e8;border:1.5px solid #27ae60;border-radius:8px;font-size:14px;color:#333;}
.numbox strong{color:#1a3a4a;font-size:18px;}
.btnmain{margin-top:16px;width:100%;padding:16px;background:#1a3a4a;color:white;border:none;border-radius:8px;font-size:17px;cursor:pointer;font-family:Georgia,serif;}
.savestatus{text-align:center;font-size:13px;color:#27ae60;padding:8px;display:none;font-weight:bold;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:10px 8px;text-align:left;color:#1a3a4a;border-bottom:2px solid #1a3a4a;}
td{padding:10px 8px;border-bottom:1px solid #eee;}
tr:nth-child(even) td{background:#fafaf8;}
.bv{padding:6px 12px;background:#1a3a4a;color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;}
.topbtns{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.bsec{padding:11px 16px;background:white;color:#1a3a4a;border:1.5px solid #1a3a4a;border-radius:8px;cursor:pointer;font-family:Georgia,serif;font-size:14px;}
.bemail{width:100%;padding:18px;background:#27ae60;color:white;border:none;border-radius:10px;cursor:pointer;font-family:Georgia,serif;font-size:17px;font-weight:bold;margin-bottom:10px;display:block;}
.bpdf{width:100%;padding:18px;background:#c0392b;color:white;border:none;border-radius:10px;cursor:pointer;font-family:Georgia,serif;font-size:17px;font-weight:bold;margin-bottom:14px;display:block;}
#inv{background:white;padding:36px 44px;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,0.1);}
.ih{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;border-bottom:2px solid #1a3a4a;padding-bottom:14px;}
.ilogo{width:82px;height:82px;object-fit:contain;}
.ip{flex:1;padding-left:16px;font-size:13px;line-height:1.85;}
.ip strong{font-size:15px;display:block;margin-bottom:3px;color:#1a3a4a;}
.idate{text-align:right;font-size:13px;white-space:nowrap;padding-top:4px;}
.inum{font-size:11px;color:#888;margin-top:4px;}
.ititle{text-align:center;font-size:20px;font-weight:bold;letter-spacing:1px;margin:22px 0 28px;color:#1a3a4a;}
.ibody{font-size:14px;line-height:2.1;}
.ifooter{margin-top:40px;}
.sw{position:relative;display:inline-block;}
.sb{border:1.5px solid #333;padding:10px 16px;display:inline-block;background:white;}
.sn{font-weight:bold;font-size:13px;}
.sl{font-size:11.5px;line-height:1.8;margin-top:2px;}
.ssig{position:absolute;top:-28px;left:-18px;width:280px;pointer-events:none;}
.empty{color:#999;text-align:center;padding:40px;}
.bannulee{padding:6px 10px;background:#e67e22;color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;}
.badge-ann{display:inline-block;background:#c0392b;color:white;font-size:10px;font-weight:bold;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;letter-spacing:0.5px;}
tr.annulee-row td{color:#aaa;text-decoration:line-through;}
tr.annulee-row td:last-child{text-decoration:none;}
.tampon{position:relative;}
.tampon::after{content:"ANNUL\00c9E POUR ERREUR";position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-35deg);font-size:42px;font-weight:bold;color:rgba(192,57,43,0.22);white-space:nowrap;pointer-events:none;letter-spacing:3px;border:6px solid rgba(192,57,43,0.18);padding:8px 18px;border-radius:4px;}
@media(max-width:500px){.g2{grid-template-columns:1fr;}.ih{flex-direction:column;gap:10px;}.idate{text-align:left;}#inv{padding:20px 16px;}}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="hdr">
  <div class="hl">
    <img class="hlogo" id="hlogo" alt="NR">
    <div><h1>Cabinet d&#39;Ost&#233;opathie</h1><p>Nicolas Roger D.O. &mdash; Narbonne</p></div>
  </div>
  <div class="nav">
    <button class="on" id="nb-form" onclick="sv('form')">&#x270F; Nouvelle</button>
    <button class="off" id="nb-history" onclick="sv('history')">Historique (<span id="hcount">0</span>)</button>
  </div>
</div>

<div class="wrap">
  <div id="v-form" class="card">
    <h2>Nouvelle Note d&#39;Honoraires</h2>
    <div class="g2">
      <div><label>Civilit&#233;</label>
        <select id="fciv"><option>M.</option><option>Mme</option><option>Dr</option></select>
      </div><div></div>
      <div><label>Nom *</label><input id="fnom" placeholder="DUPONT" autocapitalize="characters"></div>
      <div><label>Pr&#233;nom *</label><input id="fprenom" placeholder="Jean"></div>
      <div><label>Date de s&#233;ance *</label><input type="date" id="fdate"></div>
      <div><label>Montant (&#8364;)</label><input type="number" id="fmontant" value="65"></div>
      <div class="span2"><label>Email du patient</label><input type="email" id="femail" placeholder="patient@email.com"></div>
      <div class="span2"><label>Motif (optionnel)</label><input id="fmotif" placeholder="ex : douleurs lombaires"></div>
    </div>
    <div class="numbox">&#x1F4C4; Num&#233;ro : <strong id="nnum">---</strong></div>
    <div class="savestatus" id="savestatus">&#x2705; Facture sauvegard&#233;e &amp; PDF enregistr&#233; dans T&#233;l&#233;chargements !</div>
    <button class="btnmain" onclick="createInv()">&#x2705; Cr&#233;er la facture</button>
  </div>

  <div id="v-history" class="card" style="display:none">
    <h2>Historique (<span id="hcount2">0</span> factures)</h2>
    <div style="margin-bottom:14px;">
      <input id="hsearch" placeholder="&#x1F50D; Rechercher un patient..." oninput="renderHistory()" style="width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-family:Georgia,serif;font-size:15px;background:#fafaf8;">
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
      <button class="bsec" onclick="exportData()" style="font-size:12px;padding:8px 12px;">&#x2B06;&#xFE0F; Exporter mes donn&#233;es</button>
      <label class="bsec" for="importFile" style="font-size:12px;padding:8px 12px;cursor:pointer;">&#x2B07;&#xFE0F; Importer des donn&#233;es</label>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="bsec" onclick="signInDrive()" style="font-size:12px;padding:8px 12px;">&#x1F517; Connecter Google Drive</button>
      <span id="driveStatus" style="font-size:12px;color:#888;margin-left:6px;">Non connect&#233;</span>
    </div>
    <div id="hcontent"></div>
  </div>

  <div id="v-preview" style="display:none">
    <div class="topbtns">
      <button class="bsec" onclick="sv('form')">&#8592; Nouvelle</button>
      <button class="bsec" onclick="sv('history')">Historique</button>
    </div>
    <button class="bemail" onclick="doShare()">&#x2709;&#xFE0F; Envoyer la facture par email</button>
    <button class="bpdf" onclick="doDownload()">&#x2B07;&#xFE0F; T&#233;l&#233;charger le PDF</button>
    <div id="inv"></div>
  </div>

function save(){
  var d=JSON.stringify({invoices:invoices,nextNum:nextNum});
  try{localStorage.setItem(KEY,d);}catch(e){}
  try{sessionStorage.setItem(KEY,d);}catch(e){}
  pushToDriveDebounced();
}

function load(){
  var d=null;
  // Chercher dans toutes les clés possibles
  var keys=[KEY,"osteoNR","osteo9","osteo8","osteo7","osteo6","osteo5"];
  for(var i=0;i<keys.length;i++){
    try{d=localStorage.getItem(keys[i]);if(d)break;}catch(e){}
  }
  if(!d){try{d=sessionStorage.getItem(KEY);}catch(e){}}
  if(d){
    try{
      var p=JSON.parse(d);
      invoices=p.invoices||[];
      nextNum=p.nextNum||1;
    }catch(e){}
  }
  if(typeof DEFAULT_BACKUP!=="undefined"&&DEFAULT_BACKUP&&DEFAULT_BACKUP.invoices){
    var existingIds=invoices.map(function(x){return x.id;});
    DEFAULT_BACKUP.invoices.forEach(function(inv){
      if(existingIds.indexOf(inv.id)<0){invoices.push(inv);existingIds.push(inv.id);}
    });
    invoices.sort(function(a,b){return b.id-a.id;});
    if(DEFAULT_BACKUP.nextNum>nextNum)nextNum=DEFAULT_BACKUP.nextNum;
  }
  save(); // migrer / fusionner vers la nouvelle clé
}

var GOOGLE_CLIENT_ID="YOUR_CLIENT_ID.apps.googleusercontent.com";
var DRIVE_SCOPE="https://www.googleapis.com/auth/drive.appdata";
var DRIVE_FILE_NAME="factures-sync.json";
var driveTokenClient=null, driveAccessToken=null, driveFileId=null;
try{driveFileId=localStorage.getItem("driveFileId")||null;}catch(e){}
var driveSyncTimer=null;

function mergeIncoming(list, incomingNextNum){
  var existingIds=invoices.map(function(x){return x.id;});
  var added=0;
  (list||[]).forEach(function(inv){
    if(existingIds.indexOf(inv.id)<0){invoices.push(inv);existingIds.push(inv.id);added++;}
  });
  invoices.sort(function(a,b){return b.id-a.id;});
  if(incomingNextNum>nextNum)nextNum=incomingNextNum;
  return added;
}

function updateDriveStatus(txt){
  var el=document.getElementById("driveStatus");
  if(el)el.textContent=txt;
}

function driveReady(){return window.google&&google.accounts&&google.accounts.oauth2;}

function initDriveClient(){
  if(GOOGLE_CLIENT_ID.indexOf("YOUR_CLIENT_ID")===0){updateDriveStatus("Non configur\u00e9");return;}
  if(!driveReady()){setTimeout(initDriveClient,300);return;}
  driveTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:DRIVE_SCOPE,
    callback:function(resp){
      if(resp.error){updateDriveStatus("Connexion refus\u00e9e");return;}
      driveAccessToken=resp.access_token;
      updateDriveStatus("Connect\u00e9 \u2705 synchronisation...");
      syncWithDrive();
    }
  });
  driveTokenClient.requestAccessToken({prompt:""});
}

function signInDrive(){
  if(GOOGLE_CLIENT_ID.indexOf("YOUR_CLIENT_ID")===0){alert("Synchronisation Google Drive pas encore configur\u00e9e.");return;}
  if(!driveTokenClient){updateDriveStatus("Chargement de Google...");setTimeout(signInDrive,500);return;}
  driveTokenClient.requestAccessToken({prompt:"consent"});
}

function driveApi(method,url,body){
  var headers={Authorization:"Bearer "+driveAccessToken};
  if(body)headers["Content-Type"]="application/json";
  return fetch(url,{method:method,headers:headers,body:body?JSON.stringify(body):undefined});
}

function driveFindFile(){
  var q=encodeURIComponent("name='"+DRIVE_FILE_NAME+"' and trashed=false");
  return driveApi("GET","https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+q+"&fields=files(id)")
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.files&&d.files.length){driveFileId=d.files[0].id;try{localStorage.setItem("driveFileId",driveFileId);}catch(e){}return driveFileId;}
      return null;
    });
}

function driveDownload(){
  return driveApi("GET","https://www.googleapis.com/drive/v3/files/"+driveFileId+"?alt=media")
    .then(function(r){return r.ok?r.json():null;});
}

function driveUpload(data){
  var metadata=driveFileId?{name:DRIVE_FILE_NAME}:{name:DRIVE_FILE_NAME,parents:["appDataFolder"]};
  var boundary="-------factsync";
  var body="--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(metadata)+
    "\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(data)+"\r\n--"+boundary+"--";
  var url=driveFileId
    ?"https://www.googleapis.com/upload/drive/v3/files/"+driveFileId+"?uploadType=multipart"
    :"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
  return fetch(url,{
    method:driveFileId?"PATCH":"POST",
    headers:{Authorization:"Bearer "+driveAccessToken,"Content-Type":"multipart/related; boundary="+boundary},
    body:body
  }).then(function(r){return r.json();}).then(function(d){
    if(d.id){driveFileId=d.id;try{localStorage.setItem("driveFileId",driveFileId);}catch(e){}}
  });
}

function syncWithDrive(){
  driveFindFile().then(function(id){
    if(id){
      return driveDownload().then(function(d){
        var added=0;
        if(d&&Array.isArray(d.invoices))added=mergeIncoming(d.invoices,d.nextNum||1);
        if(added)save();
        return driveUpload({invoices:invoices,nextNum:nextNum});
      });
    }
    return driveUpload({invoices:invoices,nextNum:nextNum});
  }).then(function(){
    upCount();renderHistory();
    updateDriveStatus("Synchronis\u00e9 \u2705 ("+new Date().toLocaleTimeString()+")");
  }).catch(function(err){
    updateDriveStatus("Erreur de synchronisation");
  });
}

function pushToDriveDebounced(){
  if(!driveAccessToken)return;
  clearTimeout(driveSyncTimer);
  driveSyncTimer=setTimeout(function(){
    driveUpload({invoices:invoices,nextNum:nextNum});
  },1500);
}

function pad(n){return("000"+n).slice(-4);}
function fd(s){if(!s)return"";var a=s.split("-");return a[2]+"/"+a[1]+"/"+a[0];}
function today(){return new Date().toISOString().split("T")[0];}
function upNum(){document.getElementById("nnum").textContent=new Date().getFullYear()+"-"+pad(nextNum);}
function upCount(){var n=invoices.length;document.getElementById("hcount").textContent=n;document.getElementById("hcount2").textContent=n;}

window.onload=function(){load();document.getElementById("fdate").value=today();upNum();upCount();initDriveClient();};
window.addEventListener("beforeunload",save);
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")save();});

function sv(v){
  ["form","history","preview"].forEach(function(x){
    document.getElementById("v-"+x).style.display="none";
    var b=document.getElementById("nb-"+x);if(b)b.className="off";
  });
  document.getElementById("v-"+v).style.display="block";
  var nb=document.getElementById("nb-"+v);if(nb)nb.className="on";
  if(v==="history")renderHistory();
}

function createInv(){
  var nom=document.getElementById("fnom").value.trim();
  var prenom=document.getElementById("fprenom").value.trim();
  var ds=document.getElementById("fdate").value;
  if(!nom||!prenom||!ds){alert("Merci de remplir nom, pr\u00e9nom et date.");return;}
  var inv={id:Date.now(),numero:new Date(ds).getFullYear()+"-"+pad(nextNum),civilite:document.getElementById("fciv").value,nom:nom,prenom:prenom,email:document.getElementById("femail").value.trim(),dateSeance:ds,tarif:document.getElementById("fmontant").value||"65",motif:document.getElementById("fmotif").value.trim()};
  invoices.unshift(inv);nextNum++;save();upNum();upCount();
  document.getElementById("fnom").value="";document.getElementById("fprenom").value="";document.getElementById("femail").value="";document.getElementById("fmotif").value="";
  var st=document.getElementById("savestatus");st.style.display="block";setTimeout(function(){st.style.display="none";},3000);
  renderInv(inv);
  // Enregistrement automatique du PDF dès la création
  try{
    var autoPdf=buildPDF();
    autoPdf.save("facture-"+inv.numero+"-"+inv.nom+".pdf");
  }catch(e){}
  sv("preview");
}

function renderInv(inv){
  current=inv;
  var motif=inv.motif?(", pour "+inv.motif):"";
  var annBanner=inv.annulee?"<div style='background:#c0392b;color:white;text-align:center;font-weight:bold;font-size:15px;padding:10px;border-radius:6px;margin-bottom:16px;letter-spacing:1px'>&#x26A0;&#xFE0F; FACTURE ANNUL&#201;E POUR ERREUR</div>":"";
  var invClass=inv.annulee?"tampon":"";
  var h=annBanner+"<div class='"+invClass+"'>";
  h+="<div class='ih'><img class='ilogo' src='"+LOGO+"'>";
  h+="<div class='ip'><strong>"+NOM+"</strong>Ost&#233;opathe D.O.<br>"+ADR+"<br>"+VILLE+"<br>N&#176; Adeli : "+ADELI+"<br>T&#233;l. : "+TEL+"</div>";
  h+="<div class='idate'>Narbonne, le "+fd(inv.dateSeance)+"<div class='inum'>N&#176; "+inv.numero+"</div></div></div>";
  h+="<div class='ititle'>Note d&#39;honoraires</div>";
  h+="<div class='ibody'>Je soussign&#233; <strong>"+NOMINV+"</strong>, Ost&#233;opathe D.O., certifie avoir effectu&#233; une s&#233;ance d&#39;ost&#233;opathie &#224; <strong>"+inv.civilite+" "+inv.prenom+" "+inv.nom+"</strong>"+motif+", d&#39;un montant de <strong>"+inv.tarif+" euros</strong>, r&#233;gl&#233;e ce jour par le patient.</div>";
  h+="<div class='ifooter'><div class='sw'><div class='sb'><div class='sn'>Nicolas ROGER</div><div class='sl'>Ost&#233;opathe D.O.<br>"+ADR+"<br>"+VILLE+"<br>T&#233;l. : "+TEL+"<br>N&#176; Adeli : "+ADELI+"</div></div><img class='ssig' src='"+SIG+"'></div></div>";
  h+="</div>";
  document.getElementById("inv").innerHTML=h;
  // Masquer les boutons email/PDF si annulée
  var be=document.querySelector(".bemail"),bp=document.querySelector(".bpdf");
  if(be)be.style.display=inv.annulee?"none":"block";
  if(bp)bp.style.display=inv.annulee?"none":"block";
}

function buildPDF(){
  var inv=current,JP=window.jspdf.jsPDF,pdf=new JP({orientation:"portrait",unit:"mm",format:"a4"}),L=20,pw=210;
  pdf.addImage(LOGO,"JPEG",L,18,26,26);
  pdf.setFont("helvetica","bold");pdf.setFontSize(13);pdf.setTextColor(26,58,74);pdf.text(NOM,L+30,25);
  pdf.setFont("helvetica","normal");pdf.setFontSize(10);pdf.setTextColor(50,50,50);
  pdf.text("Ost\u00e9opathe D.O.",L+30,31);pdf.text(ADR,L+30,36);pdf.text(VILLE,L+30,41);
  pdf.text("N\u00b0 Adeli : "+ADELI,L+30,46);pdf.text("T\u00e9l. : "+TEL,L+30,51);
  pdf.setFontSize(10);pdf.setTextColor(60,60,60);pdf.text("Narbonne, le "+fd(inv.dateSeance),pw-L,25,{align:"right"});
  pdf.setTextColor(140,140,140);pdf.setFontSize(9);pdf.text("N\u00b0 "+inv.numero,pw-L,31,{align:"right"});
  pdf.setDrawColor(26,58,74);pdf.setLineWidth(0.5);pdf.line(L,56,pw-L,56);
  pdf.setFont("helvetica","bold");pdf.setFontSize(17);pdf.setTextColor(26,58,74);pdf.text("Note d'honoraires",pw/2,70,{align:"center"});
  pdf.setFont("helvetica","normal");pdf.setFontSize(12);pdf.setTextColor(30,30,30);
  var motif=inv.motif?(", pour "+inv.motif):"";
  var lines=pdf.splitTextToSize("Je soussign\u00e9 "+NOMINV+", Ost\u00e9opathe D.O., certifie avoir effectu\u00e9 une s\u00e9ance d'ost\u00e9opathie \u00e0 "+inv.civilite+" "+inv.prenom+" "+inv.nom+motif+", d'un montant de "+inv.tarif+" euros, r\u00e9gl\u00e9e ce jour par le patient.",pw-2*L);
  pdf.text(lines,L,85);
  pdf.addImage(SIG,"PNG",L-6,118,88,30);
  pdf.setDrawColor(60,60,60);pdf.setLineWidth(0.4);pdf.rect(L,148,82,30);
  pdf.setFont("helvetica","bold");pdf.setFontSize(10);pdf.setTextColor(20,20,20);pdf.text("Nicolas ROGER",L+3,156);
  pdf.setFont("helvetica","normal");pdf.setFontSize(9);
  pdf.text("Ost\u00e9opathe D.O.",L+3,162);pdf.text(ADR,L+3,167);pdf.text(VILLE,L+3,172);
  pdf.text("T\u00e9l. : "+TEL+"   N\u00b0 Adeli : "+ADELI,L+3,177);
  // Tampon ANNULÉE si nécessaire
  if(inv.annulee){
    pdf.setFont("helvetica","bold");pdf.setFontSize(48);
    pdf.setTextColor(192,57,43);
    pdf.saveGraphicsState();
    // Rotation diagonale au centre de la page
    var cx=pw/2,cy=148;
    pdf.text("ANNUL\u00c9E POUR ERREUR",cx,cy,{align:"center",angle:35});
    pdf.restoreGraphicsState();
    pdf.setFont("helvetica","bold");pdf.setFontSize(11);pdf.setTextColor(192,57,43);
    pdf.text("FACTURE ANNUL\u00c9E POUR ERREUR",pw/2,290,{align:"center"});
  }
  return pdf;
}

function doDownload(){try{buildPDF().save("facture-"+current.numero+"-"+current.nom+".pdf");}catch(e){alert("Erreur : "+e.message);}}

async function doShare(){
  try{
    var pdf=buildPDF(),fname="facture-"+current.numero+"-"+current.nom+".pdf";
    var em=current.email||"";
    var msgText="Bonjour,\n\nVeuillez trouver ci-joint votre note d'honoraires suite \u00e0 votre s\u00e9ance d'ost\u00e9opathie du "+fd(current.dateSeance)+".\n\nBien \u00e0 vous,\nNicolas Roger\nOst\u00e9opathe D.O.";
    var blob=pdf.output("blob"),file=new File([blob],fname,{type:"application/pdf"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      // Copier l'email dans le presse-papier avant d'ouvrir le partage
      if(em&&navigator.clipboard){
        try{await navigator.clipboard.writeText(em);}catch(ce){}
      }
      // Afficher le bandeau avec l'email
      if(em) showEmailBanner(em);
      await navigator.share({
        files:[file],
        title:"Note d'honoraires - "+current.civilite+" "+current.prenom+" "+current.nom,
        text:msgText
      });
    } else {
      pdf.save(fname);
      var subj=encodeURIComponent("Note d'honoraires - "+fd(current.dateSeance));
      var body=encodeURIComponent(msgText);
      setTimeout(function(){window.location.href="mailto:"+em+"?subject="+subj+"&body="+body;},600);
    }
  }catch(e){if(e.name!=="AbortError")alert("Erreur : "+e.message);}
}

function showEmailBanner(em){
  var old=document.getElementById("emailbanner");if(old)old.remove();
  var d=document.createElement("div");
  d.id="emailbanner";
  d.innerHTML="<div style='font-size:22px;margin-bottom:6px'>&#x2709;&#xFE0F;</div>"
    +"<div style='font-size:13px;color:#555;margin-bottom:4px'>Email du patient copi\u00e9 dans le presse-papier :</div>"
    +"<div style='font-size:17px;color:#1a3a4a;font-weight:bold;background:#e8f4e8;padding:8px 14px;border-radius:8px;margin:6px 0 10px;letter-spacing:0.3px'>"+em+"</div>"
    +"<div style='font-size:12px;color:#777;line-height:1.6'>Dans Gmail &rarr; appuyez sur le champ <strong>\u00ab&nbsp;\u00c0&nbsp;\u00bb</strong><br>puis <strong>Appui long &rarr; Coller</strong></div>"
    +"<button onclick=\"document.getElementById('emailbanner').remove()\" style='margin-top:12px;padding:7px 20px;background:#1a3a4a;color:white;border:none;border-radius:8px;font-family:Georgia,serif;font-size:13px;cursor:pointer'>OK</button>";
  d.style.cssText="position:fixed;bottom:0;left:0;right:0;background:white;border-top:3px solid #27ae60;padding:20px;font-family:Georgia,serif;text-align:center;box-shadow:0 -4px 24px rgba(0,0,0,0.18);z-index:9999;";
  document.body.appendChild(d);
}

function renderHistory(){
  var el=document.getElementById("hcontent");
  var q=(document.getElementById("hsearch")||{value:""}).value.toLowerCase().trim();
  var list=invoices.filter(function(inv){
    if(!q)return true;
    return (inv.nom+inv.prenom+inv.civilite).toLowerCase().indexOf(q)>=0||inv.numero.indexOf(q)>=0;
  });
  if(!list.length){el.innerHTML="<p class='empty'>"+(q?"Aucun r&#233;sultat pour \""+q+"\"":"Aucune facture pour l'instant.")+"</p>";return;}
  var rows="";
  for(var i=0;i<list.length;i++){
    var inv=list[i];
    var annBadge=inv.annulee?"<span class='badge-ann'>ANNUL&#201;E</span>":"";
    var rowClass=inv.annulee?" class='annulee-row'":"";
    var actionBtn=inv.annulee
      ?"<button class='bv' style='background:#888;cursor:default;opacity:0.6' disabled>Annul&#233;e</button>"
      :"<button class='bv' onclick='loadInv("+inv.id+")'>Voir</button><button class='bannulee' onclick='cancelInv("+inv.id+")' title='Annuler la facture'>&#x274C; Annuler</button>";
    rows+="<tr"+rowClass+"><td><strong style='color:#1a3a4a'>"+inv.numero+"</strong></td><td>"+fd(inv.dateSeance)+"</td><td>"+inv.civilite+" "+inv.prenom+" "+inv.nom+annBadge+"</td><td>"+inv.tarif+"&#8364;</td><td style='display:flex;gap:6px;flex-wrap:wrap'>"+actionBtn+"</td></tr>";
  }
  el.innerHTML="<table><thead><tr><th>N&#176;</th><th>Date</th><th>Patient</th><th>Montant</th><th></th></tr></thead><tbody>"+rows+"</tbody></table>";
}

function exportData(){
  var data=JSON.stringify({invoices:invoices,nextNum:nextNum});
  var blob=new Blob([data],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="factures-backup-"+new Date().toISOString().split("T")[0]+".json";
  a.click();
}

function importData(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(!d.invoices||!Array.isArray(d.invoices))throw new Error("Fichier invalide");
      var added=mergeIncoming(d.invoices, d.nextNum||1);
      save();upCount();renderHistory();
      alert("✅ Import réussi ! "+added+" facture(s) ajoutée(s).");
    }catch(err){alert("Erreur d'import : "+err.message);}
  };
  reader.readAsText(file);
  e.target.value="";
}

function loadInv(id){for(var i=0;i<invoices.length;i++){if(invoices[i].id===id){renderInv(invoices[i]);sv("preview");return;}}}
function cancelInv(id){
  if(!confirm("Annuler cette facture pour erreur ?\nElle restera dans l'historique avec la mention ANNUL\u00c9E."))return;
  for(var i=0;i<invoices.length;i++){
    if(invoices[i].id===id){invoices[i].annulee=true;break;}
  }
  save();renderHistory();
}
